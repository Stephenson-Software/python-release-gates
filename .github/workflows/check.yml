name: Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every harness and scenario compiles
        run: python -m py_compile gates/*.py scenarios/*.py
